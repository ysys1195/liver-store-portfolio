services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${E2E_DB_USER:?E2E_DB_USER is required}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?E2E_DB_PASSWORD is required}
      POSTGRES_DB: issue10_e2e
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d issue10_e2e"]
      interval: 2s
      timeout: 2s
      retries: 20
